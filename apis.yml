  - Small Business
  - Loans
  - Fintech
  - Marketplace
  - Embedded Finance
apis:
  - aid: lendio:lendio-loan-marketplace-api
    name: Lendio Loan Marketplace API
    description: >-
      REST API for connecting small businesses with lenders. Supports loan
      application submission, eligibility checking, lender matching, and loan
      product management. The Embedded Financing API allows service providers
      to integrate the Lendio marketplace with a single JavaScript snippet and
      authentication API endpoint for secure customer data sharing.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.lendio.com/embedded-financing
    baseURL: https://api.lendio.com
    tags:
      - Lending
      - Loans
      - Small Business
      - Marketplace
      - Embedded Finance
    properties:
      - type: Documentation
        url: https://www.lendio.com/embedded-financing
      - type: ReleaseNotes
        url: https://www.lendio.com/product-updates
  - aid: lendio:lendio-loan-performance-tracking-api
    name: Lendio Loan Performance Tracking API
    description: >-
      API integration for high-volume lenders that allows bulk submission of
      loan performance data. Supports up to 10,000 records per submission
      through custom code requests. Provides transaction analytics by ingesting
      data directly from core systems via API or batched data import.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.lendio.com/product-updates/loan-performance-tracking
    baseURL: https://api.lendio.com
    tags:
      - Lending
      - Loan Performance
      - Analytics
      - Bulk Data
    properties:
      - type: Documentation
        url: https://www.lendio.com/product-updates/loan-performance-tracking

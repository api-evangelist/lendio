aid: lendio
name: Lendio
description: >-
  Lendio is a small business lending marketplace that connects businesses with
  funding through a network of 75+ lenders. The platform offers a REST API for
  submitting loan applications, checking eligibility, connecting businesses with
  lenders, and managing loan products. Lendio provides Embedded Financing for
  service providers to integrate loan marketplace functionality, Intelligent
  Lending software for banks and lenders, and a Loan Performance Tracking API
  for high-volume lenders submitting bulk data records.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/lendio/refs/heads/main/apis.yml
created: '2026-06-13'
modified: '2026-06-13'
specificationVersion: '0.19'
tags:
